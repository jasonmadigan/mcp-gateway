---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: mcpgatewayextensions.mcp.kuadrant.io
spec:
  group: mcp.kuadrant.io
  names:
    kind: MCPGatewayExtension
    listKind: MCPGatewayExtensionList
    plural: mcpgatewayextensions
    shortNames:
    - mcpge
    singular: mcpgatewayextension
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Ready status
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          MCPGatewayExtension extends a Gateway API Gateway to handle the Model Context Protocol (MCP).
          When created, the controller will:
          - Deploy a broker-router Deployment and Service in the MCPGatewayExtension's namespace
          - Create an EnvoyFilter in the Gateway's namespace to route MCP traffic to the broker
          - Configure the Envoy proxy to use the external processor for MCP request handling

          The broker aggregates tools from upstream MCP servers registered via MCPServerRegistration
          resources, while the router handles MCP protocol parsing and request routing.

          Cross-namespace references to Gateways require a ReferenceGrant in the Gateway's namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of MCPGatewayExtension
            properties:
              backendPingIntervalSeconds:
                default: 60
                description: backendPingIntervalSeconds specifies how often the broker
                  pings upstream MCP servers.
                format: int32
                maximum: 7200
                minimum: 10
                type: integer
              caCertBundleRef:
                description: |-
                  caCertBundleRef references a Secret containing a PEM-encoded CA certificate
                  bundle used as the base trust pool for all upstream MCP server connections.
                  Per-server caCertSecretRef on MCPServerRegistration appends to this pool.
                  The Secret must have the label mcp.kuadrant.io/secret=true.
                properties:
                  key:
                    default: ca.crt
                    description: |-
                      key is the key within the Secret that contains the CA bundle PEM data.
                      If not specified, defaults to "ca.crt".
                    type: string
                  name:
                    description: name is the name of the Secret resource.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              cors:
                description: |-
                  cors configures Cross-Origin Resource Sharing, allowing browser-based MCP
                  clients (such as the console) to call this gateway. Headers required by the
                  MCP Streamable HTTP transport are always included, whether listed here or
                  not. allowOrigins is required: an empty list is rejected at admission.
                  When unset, cross-origin requests are refused.
                properties:
                  allowCredentials:
                    description: |-
                      AllowCredentials indicates whether the actual cross-origin request allows
                      to include credentials.

                      When set to true, the gateway will include the `Access-Control-Allow-Credentials`
                      response header with value true (case-sensitive).

                      When set to false or omitted the gateway will omit the header
                      `Access-Control-Allow-Credentials` entirely (this is the standard CORS
                      behavior).

                      Support: Extended
                    type: boolean
                  allowHeaders:
                    description: |-
                      AllowHeaders indicates which HTTP request headers are supported for
                      accessing the requested resource.

                      Header names are not case-sensitive.

                      Multiple header names in the value of the `Access-Control-Allow-Headers`
                      response header are separated by a comma (",").

                      When the `allowHeaders` field is configured with one or more headers, the
                      gateway must return the `Access-Control-Allow-Headers` response header
                      which value is present in the `allowHeaders` field.

                      If any header name in the `Access-Control-Request-Headers` request header
                      is not included in the list of header names specified by the response
                      header `Access-Control-Allow-Headers`, it will present an error on the
                      client side.

                      If any header name in the `Access-Control-Allow-Headers` response header
                      does not recognize by the client, it will also occur an error on the
                      client side.

                      A wildcard indicates that the requests with all HTTP headers are allowed.

                      If the configuration contains the wildcard `*` in `allowHeaders` and
                      `allowCredentials` is set to `false`, the `Access-Control-Allow-Headers`
                      response header may either contain the wildcard `*` or echo the value
                      of the `Access-Control-Request-Headers` request header.

                      If the configuration contains the wildcard `*` in `allowHeaders` and
                      `allowCredentials` is set to `true`, the gateway must not return `*`
                      in the `Access-Control-Allow-Headers` response header. Instead, it must
                      return one or more header names matching the value of the
                      `Access-Control-Request-Headers` request header.
                      If the `Access-Control-Request-Headers` header is not present in the
                      request, the gateway must omit the `Access-Control-Allow-Headers`
                      response header.

                      Support: Extended
                    items:
                      description: |-
                        HTTPHeaderName is the name of an HTTP header.

                        Valid values include:

                        * "Authorization"
                        * "Set-Cookie"

                        Invalid values include:

                          - ":method" - ":" is an invalid character. This means that HTTP/2 pseudo
                            headers are not currently supported by this type.
                          - "/invalid" - "/ " is an invalid character
                      maxLength: 256
                      minLength: 1
                      pattern: ^[A-Za-z0-9!#$%&'*+\-.^_\x60|~]+$
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: set
                    x-kubernetes-validations:
                    - message: AllowHeaders cannot contain '*' alongside other methods
                      rule: '!(''*'' in self && self.size() > 1)'
                  allowMethods:
                    description: |-
                      AllowMethods indicates which HTTP methods are supported for accessing the
                      requested resource.

                      Valid values are any method defined by RFC9110, along with the special
                      value `*`, which represents all HTTP methods are allowed.

                      Method names are case-sensitive, so these values are also case-sensitive.
                      (See https://www.rfc-editor.org/rfc/rfc2616#section-5.1.1)

                      Multiple method names in the value of the `Access-Control-Allow-Methods`
                      response header are separated by a comma (",").

                      A CORS-safelisted method is a method that is `GET`, `HEAD`, or `POST`.
                      (See https://fetch.spec.whatwg.org/#cors-safelisted-method) The
                      CORS-safelisted methods are always allowed, regardless of whether they
                      are specified in the `allowMethods` field.

                      When the `allowMethods` field is configured with one or more methods, the
                      gateway must return the `Access-Control-Allow-Methods` response header
                      which value is present in the `allowMethods` field.

                      If the HTTP method of the `Access-Control-Request-Method` request header
                      is not included in the list of methods specified by the response header
                      `Access-Control-Allow-Methods`, it will present an error on the client
                      side.

                      If the configuration contains the wildcard `*` in `allowMethods` and
                      `allowCredentials` is set to `false`, the `Access-Control-Allow-Methods`
                      response header may either contain the wildcard `*` or echo the value
                      of the `Access-Control-Request-Method` request header.

                      If the configuration contains the wildcard `*` in `allowMethods` and
                      `allowCredentials` is set to `true`, the gateway must not return `*`
                      in the `Access-Control-Allow-Methods` response header. Instead, it must
                      return a single HTTP method matching the value of the
                      `Access-Control-Request-Method` request header.
                      If the `Access-Control-Request-Method` header is not present in the request,
                      the gateway must omit the `Access-Control-Allow-Methods` response header.

                      Support: Extended
                    items:
                      enum:
                      - GET
                      - HEAD
                      - POST
                      - PUT
                      - DELETE
                      - CONNECT
                      - OPTIONS
                      - TRACE
                      - PATCH
                      - '*'
                      type: string
                    maxItems: 9
                    type: array
                    x-kubernetes-list-type: set
                    x-kubernetes-validations:
                    - message: AllowMethods cannot contain '*' alongside other methods
                      rule: '!(''*'' in self && self.size() > 1)'
                  allowOrigins:
                    description: |-
                      AllowOrigins indicates whether the response can be shared with requested
                      resource from the given `Origin`.

                      The `Origin` consists of a scheme and a host, with an optional port, and
                      takes the form `<scheme>://<host>(:<port>)`.

                      Valid values for scheme are: `http` and `https`.

                      Valid values for port are any integer between 1 and 65535 (the list of
                      available TCP/UDP ports). Note that, if not included, port `80` is
                      assumed for `http` scheme origins, and port `443` is assumed for `https`
                      origins. This may affect origin matching.

                      The host part of the origin may contain the wildcard character `*`. These
                      wildcard characters behave as follows:

                      * `*` is a greedy match to the _left_, including any number of
                        DNS labels to the left of its position. This also means that
                        `*` will include any number of period `.` characters to the
                        left of its position.
                      * A wildcard by itself matches all hosts.

                      An origin value that includes _only_ the `*` character indicates requests
                      from all `Origin`s are allowed.

                      When the `allowOrigins` field is configured with multiple origins, it
                      means the server supports clients from multiple origins. If the request
                      `Origin` matches the configured allowed origins, the gateway must return
                      the given `Origin` and sets value of the header
                      `Access-Control-Allow-Origin` same as the `Origin` header provided by the
                      client.

                      The status code of a successful response to a "preflight" request is
                      always an OK status (i.e., 204 or 200).

                      If the request `Origin` does not match the configured allowed origins,
                      the gateway returns 204/200 response but doesn't set the relevant
                      cross-origin response headers. Alternatively, the gateway responds with
                      403 status to the "preflight" request is denied, coupled with omitting
                      the CORS headers. The cross-origin request fails on the client side.
                      Therefore, the client doesn't attempt the actual cross-origin request.

                      Conversely, if the request `Origin` matches one of the configured
                      allowed origins, the gateway sets the response header
                      `Access-Control-Allow-Origin` to the same value as the `Origin`
                      header provided by the client.

                      If the configuration contains the wildcard `*` in `allowOrigins` and
                      `allowCredentials` is set to `false`, the `Access-Control-Allow-Origin`
                      response header may either contain the wildcard `*` or echo the value
                      of the `Origin` request header.

                      If the configuration contains the wildcard `*` in `allowOrigins` and
                      `allowCredentials` is set to `true`, the gateway must not return `*`
                      in the `Access-Control-Allow-Origin` response header. Instead, it must
                      return a single origin matching the value of the `Origin` request header.

                      Support: Extended
                    items:
                      description: |-
                        The CORSOrigin MUST NOT be a relative URI, and it MUST follow the URI syntax and
                        encoding rules specified in RFC3986.  The CORSOrigin MUST include both a
                        scheme ("http" or "https") and a scheme-specific-part, or it should be a single '*' character.
                        URIs that include an authority MUST include a fully qualified domain name or
                        IP address as the host.
                      maxLength: 253
                      minLength: 1
                      pattern: (^\*$)|(^(http(s)?):\/\/(((\*\.)?([a-zA-Z0-9\-]+\.)*[a-zA-Z0-9-]+|\*)(:([0-9]{1,5}))?)$)
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: set
                    x-kubernetes-validations:
                    - message: AllowOrigins cannot contain '*' alongside other origins
                      rule: '!(''*'' in self && self.size() > 1)'
                  exposeHeaders:
                    description: |-
                      ExposeHeaders indicates which HTTP response headers can be exposed
                      to client-side scripts in response to a cross-origin request.

                      A CORS-safelisted response header is an HTTP header in a CORS response
                      that it is considered safe to expose to the client scripts.
                      The CORS-safelisted response headers include the following headers:
                      `Cache-Control`
                      `Content-Language`
                      `Content-Length`
                      `Content-Type`
                      `Expires`
                      `Last-Modified`
                      `Pragma`
                      (See https://fetch.spec.whatwg.org/#cors-safelisted-response-header-name)
                      The CORS-safelisted response headers are exposed to client by default.

                      When an HTTP header name is specified using the `exposeHeaders` field,
                      this additional header will be exposed as part of the response to the
                      client.

                      Header names are not case-sensitive.

                      Multiple header names in the value of the `Access-Control-Expose-Headers`
                      response header are separated by a comma (",").

                      A wildcard indicates that the responses with all HTTP headers are exposed
                      to clients.

                      If the configuration contains the wildcard `*` in `exposeHeaders` and
                      `allowCredentials` is set to `false`, the `Access-Control-Expose-Headers`
                      response header can contain the wildcard `*`.

                      If the configuration contains the wildcard `*` in `exposeHeaders` and
                      `allowCredentials` is set to `true`, the gateway cannot use the `*`
                      in the `Access-Control-Expose-Headers` response header.

                      Support: Extended
                    items:
                      description: |-
                        HTTPHeaderName is the name of an HTTP header.

                        Valid values include:

                        * "Authorization"
                        * "Set-Cookie"

                        Invalid values include:

                          - ":method" - ":" is an invalid character. This means that HTTP/2 pseudo
                            headers are not currently supported by this type.
                          - "/invalid" - "/ " is an invalid character
                      maxLength: 256
                      minLength: 1
                      pattern: ^[A-Za-z0-9!#$%&'*+\-.^_\x60|~]+$
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: set
                  maxAge:
                    default: 5
                    description: |-
                      MaxAge indicates the duration (in seconds) for the client to cache the
                      results of a "preflight" request.

                      The information provided by the `Access-Control-Allow-Methods` and
                      `Access-Control-Allow-Headers` response headers can be cached by the
                      client until the time specified by `Access-Control-Max-Age` elapses.

                      The default value of `Access-Control-Max-Age` response header is 5
                      (seconds).

                      When the `MaxAge` field is unspecified, the gateway sets the response
                      header "Access-Control-Max-Age: 5" by default.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: cors.allowOrigins must not be empty
                  rule: has(self.allowOrigins) && size(self.allowOrigins) > 0
                - message: cors.allowCredentials cannot be true when allowOrigins
                    contains a wildcard '*'
                  rule: '!(has(self.allowCredentials) && self.allowCredentials &&
                    has(self.allowOrigins) && self.allowOrigins.exists(o, o.contains(''*'')))'
              httpRouteManagement:
                default: Enabled
                description: |-
                  httpRouteManagement controls whether the operator manages the gateway HTTPRoute.
                  Enabled: creates and manages the HTTPRoute (default).
                  Disabled: does not create an HTTPRoute.
                enum:
                - Enabled
                - Disabled
                type: string
              logLevel:
                description: |-
                  logLevel controls the broker-router log verbosity.
                  Maps to the broker's --log-level flag: debug=-4, info=0, warn=4, error=8.
                  When unset, the operator-wide BROKER_ROUTER_LOG_LEVEL default (if configured) is used.
                enum:
                - debug
                - info
                - warn
                - error
                type: string
              oauthProtectedResource:
                description: |-
                  oauthProtectedResource configures the OAuth protected resource metadata
                  served at /.well-known/oauth-protected-resource. When set, the controller
                  injects the corresponding OAUTH_* env vars into the broker-router deployment.
                properties:
                  authorizationServers:
                    description: authorizationServers lists the OAuth authorization
                      server URLs.
                    items:
                      pattern: ^https?://[^,]+$
                      type: string
                    maxItems: 10
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: atomic
                  bearerMethodsSupported:
                    description: |-
                      bearerMethodsSupported lists the supported bearer token methods.
                      Defaults to ["header"].
                    items:
                      type: string
                    maxItems: 10
                    type: array
                    x-kubernetes-list-type: atomic
                  resource:
                    description: |-
                      resource is the URI of the protected resource.
                      Defaults to https://<publicHost>/mcp.
                    maxLength: 2048
                    type: string
                  resourceName:
                    description: |-
                      resourceName is the human-readable name for this resource.
                      Defaults to "MCP Server".
                    maxLength: 253
                    type: string
                  scopesSupported:
                    description: |-
                      scopesSupported lists the supported OAuth scopes.
                      Defaults to ["basic"].
                    items:
                      type: string
                    maxItems: 50
                    type: array
                    x-kubernetes-list-type: atomic
                required:
                - authorizationServers
                type: object
              privateHost:
                description: |-
                  privateHost overrides the internal host used for hair-pinning requests
                  back through the gateway. Defaults to
                  <gateway>-<gatewayClassName>.<ns>.svc.cluster.local:<port>, with an https://
                  scheme prefix when the targeted Gateway listener uses the HTTPS protocol. The
                  value supplied here is honoured verbatim, so an operator can include a
                  scheme (e.g. "https://my-gw:443") or pin to a different port.
                type: string
              publicHost:
                description: |-
                  publicHost overrides the public host derived from the listener hostname.
                  Use when the listener has a wildcard and you need a specific host.
                type: string
              sessionStore:
                description: |-
                  sessionStore references a secret for redis-based session storage.
                  The secret must exist in the MCPGatewayExtension namespace and contain a CACHE_CONNECTION_STRING key.
                  The value is injected as CACHE_CONNECTION_STRING into the broker-router deployment.
                  When not set, in-memory session storage is used.
                properties:
                  secretName:
                    description: |-
                      secretName is the name of the secret containing the CACHE_CONNECTION_STRING key.
                      The value should be a redis connection string: redis://<user>:<pass>@<host>:<port>/<db>
                    minLength: 1
                    type: string
                required:
                - secretName
                type: object
              targetRef:
                description: |-
                  targetRef specifies the Gateway to extend with MCP protocol support.
                  The controller will create an EnvoyFilter targeting this Gateway's Envoy proxy.
                properties:
                  group:
                    default: gateway.networking.k8s.io
                    description: group is the group of the target resource.
                    enum:
                    - gateway.networking.k8s.io
                    type: string
                  kind:
                    default: Gateway
                    description: kind is the kind of the target resource.
                    enum:
                    - Gateway
                    type: string
                  name:
                    description: name is the name of the target resource.
                    minLength: 1
                    type: string
                  namespace:
                    description: namespace of the target resource (optional, defaults
                      to same namespace)
                    type: string
                  sectionName:
                    description: |-
                      sectionName is the name of a listener on the target Gateway. The controller will
                      read the listener's port and hostname to configure the MCP Gateway instance.
                      Only one MCPGatewayExtension is allowed per namespace. MCPGatewayExtensions in
                      different namespaces may target different listeners on the same Gateway, provided
                      those listeners use different ports.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                - sectionName
                type: object
              trustedHeadersKey:
                description: |-
                  trustedHeadersKey configures trusted-header key pair for JWT-based tool filtering.
                  When set, the public key secret is wired into the broker deployment.
                properties:
                  generate:
                    default: Disabled
                    description: |-
                      generate controls whether the operator generates an ECDSA P-256 key pair.
                      Enabled: creates <secretName> (public key) and <secretName>-private (private key)
                      in the MCPGatewayExtension namespace with owner references.
                      Disabled: the secret must already exist (default).
                      Changing this field requires deleting the existing secrets first to ensure
                      the public and private keys are a matching pair.
                    enum:
                    - Enabled
                    - Disabled
                    type: string
                  secretName:
                    description: |-
                      secretName is the name of the secret containing the public key used by the broker
                      to verify trusted-header JWTs. The secret must have a data entry with key "key"
                      containing the PEM-encoded public key.
                      When Generate is Enabled, the operator creates this secret.
                      When Generate is Disabled, this secret must already exist in the namespace.
                    minLength: 1
                    type: string
                required:
                - secretName
                type: object
              urlElicitation:
                default: Disabled
                description: |-
                  urlElicitation controls whether URL-based token elicitation is enabled.
                  Enabled: creates a separate /tokens HTTPRoute and passes --enable-url-elicitation to the broker.
                  Disabled: no /tokens route is created (default).
                enum:
                - Enabled
                - Disabled
                type: string
            required:
            - targetRef
            type: object
          status:
            description: status defines the observed state of MCPGatewayExtension
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the MCPGatewayExtension.
                  The Ready condition indicates whether the broker-router deployment is running
                  and the EnvoyFilter has been successfully applied to the target Gateway.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              mcpEndpoint:
                description: |-
                  mcpEndpoint is the resolved public URL clients use to reach this MCP
                  gateway, for example https://mcp.example.com/mcp. Set once the public host
                  is derived during reconcile.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
  - additionalPrinterColumns:
    - description: Ready status
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    deprecated: true
    deprecationWarning: mcp.kuadrant.io/v1alpha1 MCPGatewayExtension is deprecated;
      migrate to mcp.kuadrant.io/v1
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MCPGatewayExtension extends a Gateway API Gateway to handle the Model Context Protocol (MCP).
          When created, the controller will:
          - Deploy a broker-router Deployment and Service in the MCPGatewayExtension's namespace
          - Create an EnvoyFilter in the Gateway's namespace to route MCP traffic to the broker
          - Configure the Envoy proxy to use the external processor for MCP request handling

          The broker aggregates tools from upstream MCP servers registered via MCPServerRegistration
          resources, while the router handles MCP protocol parsing and request routing.

          Cross-namespace references to Gateways require a ReferenceGrant in the Gateway's namespace.
        properties:
